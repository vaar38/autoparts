# Настройки журнала slf4j-simple: пишем в консоль сообщения уровня INFO и выше.
# Пользователь журнал не видит — ему ошибки показываются в диалоговых окнах.
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss
org.slf4j.simpleLogger.log.org.apache.poi=warn
